<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>10k – Das Würfelspiel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0f0f0f; --bg2: #1a1a1a; --bg3: #222;
    --border: rgba(255,255,255,0.08); --border2: rgba(255,255,255,0.15);
    --text: #f0f0f0; --text2: #888;
    --accent: #e8d5a3; --accent2: #c4a96b;
    --danger: #e05555; --danger-bg: rgba(224,85,85,0.12);
    --radius: 16px; --radius-sm: 10px;
  }
  html, body { height: 100%; overflow: hidden; }
  body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); }

  .screen {
    display: none;
    position: fixed;
    inset: 0;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
  }
  .screen.active { display: block; }
  .screen-inner {
    max-width: 480px;
    margin: 0 auto;
    padding: 1.5rem 1rem 3rem;
    min-height: 100%;
  }

  h1 { font-family: 'Syne', sans-serif; font-size: 28px; font-weight: 800; letter-spacing: -0.5px; margin-bottom: 1.5rem; }
  .card { background: var(--bg2); border: 1px solid var(--border); border-radius: var(--radius); padding: 1.25rem; margin-bottom: 12px; }
  .label { font-size: 12px; font-weight: 500; letter-spacing: 0.8px; text-transform: uppercase; color: var(--text2); margin-bottom: 10px; display: block; }
  .divider { height: 1px; background: var(--border); margin: 1rem 0; }

  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    padding: 12px 20px; border-radius: var(--radius-sm); border: 1px solid var(--border2);
    background: transparent; color: var(--text); font-family: 'DM Sans', sans-serif;
    font-size: 15px; font-weight: 500; cursor: pointer; transition: all 0.15s ease;
    -webkit-tap-highlight-color: transparent;
  }
  .btn:hover { background: var(--bg3); }
  .btn:active { transform: scale(0.97); }
  .btn-primary { background: var(--accent); color: #1a1208; border-color: var(--accent); font-weight: 600; font-family: 'Syne', sans-serif; }
  .btn-primary:hover { background: var(--accent2); border-color: var(--accent2); }
  .btn-danger { border-color: var(--danger); color: var(--danger); background: var(--danger-bg); }
  .btn-danger:hover { background: rgba(224,85,85,0.2); }
  .btn-ghost { border-color: transparent; color: var(--text2); font-size: 13px; padding: 8px 14px; }
  .btn-ghost:hover { color: var(--text); background: var(--bg3); border-color: var(--border); }
  .btn-full { width: 100%; padding: 16px; font-size: 17px; border-radius: var(--radius); }
  .btn-abort { border-color: transparent; color: var(--text2); font-size: 13px; width: 100%; margin-top: 8px; }
  .btn-abort:hover { color: var(--danger); background: var(--danger-bg); border-color: var(--danger); }
  .btn-back { background: none; border: none; color: var(--text2); font-size: 14px; cursor: pointer; padding: 0 0 1.5rem; display: flex; align-items: center; gap: 6px; font-family: 'DM Sans', sans-serif; -webkit-tap-highlight-color: transparent; }
  .btn-back:hover { color: var(--text); }

  input[type=text], input[type=number] {
    width: 100%; padding: 12px 14px; background: var(--bg3); border: 1px solid var(--border2);
    border-radius: var(--radius-sm); color: var(--text); font-family: 'DM Sans', sans-serif;
    font-size: 16px; outline: none; transition: border-color 0.15s; -webkit-appearance: none;
  }
  input:focus { border-color: var(--accent); }
  input::placeholder { color: var(--text2); }
  input[type=number]::-webkit-inner-spin-button, input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; }

  /* INTRO */
  #screen-intro .screen-inner {
    display: flex; flex-direction: column; align-items: center;
    justify-content: center; min-height: 100vh; text-align: center;
  }
  #intro-number { font-family: 'Syne', sans-serif; font-size: clamp(96px, 25vw, 140px); font-weight: 800; color: var(--accent); letter-spacing: -4px; line-height: 1; }
  #intro-sub { font-size: 14px; letter-spacing: 3px; text-transform: uppercase; color: var(--text2); margin-top: 12px; opacity: 0; transition: opacity 0.5s; }
  #intro-btn { margin-top: 3rem; opacity: 0; pointer-events: none; transition: opacity 0.5s 0.3s; min-width: 200px; }

  /* COUNT */
  .count-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-top: 10px; }
  .count-btn {
    padding: 18px 8px; font-family: 'Syne', sans-serif; font-size: 22px; font-weight: 700;
    border-radius: var(--radius-sm); border: 1px solid var(--border2); background: var(--bg3);
    color: var(--text2); cursor: pointer; transition: all 0.15s; text-align: center;
    -webkit-tap-highlight-color: transparent;
  }
  .count-btn:hover { background: var(--accent); border-color: var(--accent); color: #1a1208; }
  .count-btn:active { transform: scale(0.95); }

  /* NAMES */
  .player-row { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
  .player-row input { flex: 1; }
  .order-btns { display: flex; flex-direction: column; gap: 4px; }
  .order-btn {
    width: 36px; height: 28px; padding: 0; font-size: 14px; border-radius: 8px;
    border: 1px solid var(--border2); background: var(--bg3); color: var(--text);
    cursor: pointer; display: flex; align-items: center; justify-content: center;
    transition: all 0.15s; -webkit-tap-highlight-color: transparent;
  }
  .order-btn:hover { background: var(--accent); color: #1a1208; border-color: var(--accent); }
  .order-btn:active { transform: scale(0.93); }

  /* GAME */
  .current-card {
    background: linear-gradient(135deg, #1e1a10, #2a2010);
    border: 1px solid rgba(232,213,163,0.2); border-radius: var(--radius);
    padding: 1.5rem; margin-bottom: 12px; text-align: center;
  }
  .current-label { font-size: 11px; letter-spacing: 2px; text-transform: uppercase; color: var(--accent2); margin-bottom: 6px; }
  .current-name { font-family: 'Syne', sans-serif; font-size: 32px; font-weight: 800; color: var(--accent); letter-spacing: -1px; }
  .current-pts { font-size: 15px; color: var(--text2); margin-top: 4px; }
  .progress-track { height: 4px; background: rgba(255,255,255,0.08); border-radius: 2px; margin-top: 14px; overflow: hidden; }
  .progress-fill { height: 100%; background: var(--accent); border-radius: 2px; transition: width 0.4s ease; }

  .warning-bar {
    display: none; background: var(--danger-bg); border: 1px solid rgba(224,85,85,0.3);
    border-radius: var(--radius-sm); padding: 12px 16px; margin-bottom: 12px;
    color: var(--danger); font-size: 14px; font-weight: 500; align-items: center; gap: 8px;
  }
  .warning-bar.show { display: flex; }

  .score-row { display: flex; align-items: center; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid var(--border); }
  .score-row:last-child { border-bottom: none; }
  .score-row.active .s-name { color: var(--accent); font-weight: 700; }
  .s-name { font-size: 15px; color: var(--text); }
  .s-right { display: flex; align-items: center; gap: 10px; }
  .s-pts { font-family: 'Syne', sans-serif; font-size: 16px; font-weight: 700; color: var(--text); min-width: 72px; text-align: right; }
  .s-pts.negative { color: var(--danger); }
  .dots { display: flex; gap: 4px; align-items: center; width: 36px; justify-content: flex-end; }
  .dot { width: 8px; height: 8px; border-radius: 50%; border: 1px solid var(--border2); background: transparent; flex-shrink: 0; }
  .dot.on { background: var(--danger); border-color: var(--danger); }

  .action-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 8px; }

  /* WINNER */
  .winner-header { text-align: center; padding: 2rem 0 1.5rem; }
  .trophy { font-size: 56px; margin-bottom: 12px; }
  .winner-name { font-family: 'Syne', sans-serif; font-size: 32px; font-weight: 800; color: var(--accent); }
  .winner-pts { color: var(--text2); margin-top: 4px; font-size: 15px; }
  .podium-row { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--border); }
  .podium-row:last-child { border-bottom: none; }
  .podium-pos { font-size: 20px; width: 28px; text-align: center; }
  .podium-name { flex: 1; font-size: 15px; }
  .podium-pts { font-family: 'Syne', sans-serif; font-size: 16px; font-weight: 700; }
  .podium-pts.negative { color: var(--danger); }

  /* MODAL */
  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.75); align-items: center; justify-content: center; z-index: 999; padding: 1rem; }
  .modal-overlay.show { display: flex; }
  .modal { background: var(--bg2); border: 1px solid var(--border2); border-radius: var(--radius); padding: 1.5rem; max-width: 320px; width: 100%; text-align: center; }
  .modal h2 { font-family: 'Syne', sans-serif; font-size: 20px; font-weight: 700; margin-bottom: 8px; }
  .modal p { color: var(--text2); font-size: 14px; margin-bottom: 1.5rem; line-height: 1.5; }
  .modal-btns { display: flex; flex-direction: column; gap: 8px; }

  @media (max-width: 380px) { .current-name { font-size: 26px; } }
  @media (min-width: 600px) { .screen-inner { padding: 2rem 1.5rem 4rem; } .current-name { font-size: 36px; } }
</style>
</head>
<body>

<!-- SEITE 1: INTRO -->
<div id="screen-intro" class="screen active">
  <div class="screen-inner">
    <div id="intro-number">0</div>
    <div id="intro-sub">Das Würfelspiel</div>
    <button class="btn btn-primary btn-full" id="intro-btn" onclick="show('count')" style="max-width:220px;">Spiel einrichten</button>
  </div>
</div>

<!-- SEITE 2: ANZAHL WÄHLEN -->
<div id="screen-count" class="screen">
  <div class="screen-inner">
    <h1>Spieler einrichten</h1>
    <div class="card">
      <span class="label">Wie viele Spieler?</span>
      <div class="count-grid">
        <div class="count-btn" onclick="setCount(2)">2</div>
        <div class="count-btn" onclick="setCount(3)">3</div>
        <div class="count-btn" onclick="setCount(4)">4</div>
        <div class="count-btn" onclick="setCount(5)">5</div>
        <div class="count-btn" onclick="setCount(6)">6</div>
        <div class="count-btn" onclick="setCount(7)">7</div>
        <div class="count-btn" onclick="setCount(8)">8</div>
      </div>
    </div>
  </div>
</div>

<!-- SEITE 3: NAMEN EINGEBEN -->
<div id="screen-names" class="screen">
  <div class="screen-inner">
    <button class="btn-back" onclick="show('count')">← Zurück</button>
    <h1>Namen eingeben</h1>
    <div class="card">
      <span class="label">Namen & Reihenfolge</span>
      <div id="player-list"></div>
      <div class="divider"></div>
      <button class="btn btn-primary btn-full" onclick="startGame()">Spiel starten</button>
    </div>
  </div>
</div>

<!-- SEITE 4: SPIEL -->
<div id="screen-game" class="screen">
  <div class="screen-inner">
    <div class="current-card">
      <div class="current-label">Jetzt am Zug</div>
      <div class="current-name" id="cur-name">–</div>
      <div class="current-pts" id="cur-pts">0 Punkte</div>
      <div class="progress-track"><div class="progress-fill" id="cur-progress" style="width:0%"></div></div>
    </div>
    <div class="warning-bar" id="warn-bar">⚠️ Achtung – bereits 2x keine Punkte!</div>
    <div class="card" id="scoreboard"></div>
    <div class="card">
      <span class="label">Punkte dieser Runde</span>
      <input type="number" id="pts-input" placeholder="z.B. 250" inputmode="numeric"
        onkeydown="if(event.key==='Enter') confirmPoints()" style="margin-bottom:12px;" />
      <div class="action-row">
        <button class="btn btn-ghost" onclick="undoLast()">← Zurück</button>
        <button class="btn btn-danger" onclick="noPoints()">Keine Punkte</button>
      </div>
      <button class="btn btn-primary btn-full" onclick="confirmPoints()">Bestätigen</button>
      <button class="btn btn-abort" onclick="askAbort()">Spiel abbrechen</button>
    </div>
  </div>
</div>

<!-- SEITE 5: GEWINNER -->
<div id="screen-winner" class="screen">
  <div class="screen-inner">
    <div class="winner-header">
      <div class="trophy">🏆</div>
      <div class="winner-name" id="win-name">–</div>
      <div class="winner-pts" id="win-pts"></div>
    </div>
    <div class="card" id="final-board"></div>
    <button class="btn btn-primary btn-full" style="margin-top:1rem;" onclick="resetGame()">Neues Spiel</button>
  </div>
</div>

<!-- MODAL -->
<div class="modal-overlay" id="abort-modal">
  <div class="modal">
    <h2>Spiel abbrechen?</h2>
    <p>Der aktuelle Spielstand geht verloren. Wirklich abbrechen?</p>
    <div class="modal-btns">
      <button class="btn btn-danger btn-full" onclick="confirmAbort()">Ja, abbrechen</button>
      <button class="btn btn-full" onclick="closeModal()">Weiterspielen</button>
    </div>
  </div>
</div>

<script>
let players = [], cur = 0, hist = [], gameActive = false;
const SAVE_KEY = '10k_save';

window.addEventListener('beforeunload', e => {
  if (gameActive) { e.preventDefault(); e.returnValue = ''; }
});

function show(id) {
  document.querySelectorAll('.screen').forEach(s => {
    s.classList.remove('active');
    s.scrollTop = 0;
  });
  const el = document.getElementById('screen-' + id);
  el.classList.add('active');
  el.scrollTop = 0;
}

function saveState() {
  try { localStorage.setItem(SAVE_KEY, JSON.stringify({ players, cur, hist })); } catch(e) {}
}
function loadState() {
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    if (!raw) return false;
    const s = JSON.parse(raw);
    if (!s.players || !s.players.length) return false;
    players = s.players; cur = s.cur; hist = s.hist || [];
    return true;
  } catch(e) { return false; }
}
function clearState() {
  try { localStorage.removeItem(SAVE_KEY); } catch(e) {}
}

window.addEventListener('DOMContentLoaded', () => {
  if (loadState()) {
    gameActive = true;
    renderGame();
    show('game');
    return;
  }
  runIntro();
});

function runIntro() {
  const el = document.getElementById('intro-number');
  const sub = document.getElementById('intro-sub');
  const btn = document.getElementById('intro-btn');
  let n = 0;
  const step = () => {
    n += Math.ceil((10 - n) / 3) || 1;
    if (n >= 10) {
      el.textContent = '10';
      setTimeout(() => {
        el.textContent = '10k';
        sub.style.opacity = '1';
        btn.style.opacity = '1';
        btn.style.pointerEvents = 'auto';
      }, 300);
      return;
    }
    el.textContent = n;
    setTimeout(step, 120);
  };
  setTimeout(step, 600);
}

function setCount(n) {
  const list = document.getElementById('player-list');
  list.innerHTML = '';
  for (let i = 0; i < n; i++) {
    list.innerHTML += `<div class="player-row">
      <input type="text" placeholder="Spieler ${i+1}" id="pn-${i}" />
      <div class="order-btns">
        <button class="order-btn" onclick="moveUp(${i})">▲</button>
        <button class="order-btn" onclick="moveDown(${i})">▼</button>
      </div>
    </div>`;
  }
  show('names');
}

function moveUp(i) {
  const all = document.querySelectorAll('[id^="pn-"]');
  if (i === 0) return;
  [all[i].value, all[i-1].value] = [all[i-1].value, all[i].value];
}
function moveDown(i) {
  const all = document.querySelectorAll('[id^="pn-"]');
  if (i >= all.length - 1) return;
  [all[i].value, all[i+1].value] = [all[i+1].value, all[i].value];
}

function startGame() {
  const inputs = document.querySelectorAll('[id^="pn-"]');
  if (!inputs.length) return;
  players = Array.from(inputs).map((inp, i) => ({
    name: inp.value.trim() || 'Spieler ' + (i+1),
    score: 0, streak: 0
  }));
  cur = 0; hist = []; gameActive = true;
  saveState();
  renderGame();
  show('game');
}

function saveHist() {
  hist.push({ players: JSON.parse(JSON.stringify(players)), cur });
  if (hist.length > 60) hist.shift();
}

function renderGame() {
  const p = players[cur];
  document.getElementById('cur-name').textContent = p.name;
  document.getElementById('cur-pts').textContent = p.score.toLocaleString('de-DE') + ' Punkte';
  const pct = Math.min(100, Math.max(0, (p.score / 10000) * 100));
  document.getElementById('cur-progress').style.width = pct + '%';
  const wb = document.getElementById('warn-bar');
  p.streak === 2 ? wb.classList.add('show') : wb.classList.remove('show');

  document.getElementById('scoreboard').innerHTML = players.map((pl, i) => {
    const dots = [0,1,2].map(d => `<span class="dot ${d < pl.streak ? 'on' : ''}"></span>`).join('');
    return `<div class="score-row ${i===cur?'active':''}">
      <span class="s-name">${pl.name}</span>
      <div class="s-right">
        <div class="dots">${dots}</div>
        <span class="s-pts ${pl.score<0?'negative':''}">${pl.score.toLocaleString('de-DE')}</span>
      </div>
    </div>`;
  }).join('');

  document.getElementById('pts-input').value = '';
  setTimeout(() => document.getElementById('pts-input').focus(), 50);
}

function confirmPoints() {
  const raw = document.getElementById('pts-input').value;
  const val = parseInt(raw);
  if (raw === '' || isNaN(val) || val <= 0) { noPoints(); return; }
  saveHist();
  players[cur].score += val;
  players[cur].streak = 0;
  if (players[cur].score >= 10000) { showWinner(); return; }
  cur = (cur + 1) % players.length;
  saveState();
  renderGame();
}

function noPoints() {
  saveHist();
  players[cur].streak++;
  if (players[cur].streak >= 3) {
    players[cur].score -= 500;
    players[cur].streak = 0;
  }
  cur = (cur + 1) % players.length;
  saveState();
  renderGame();
}

function undoLast() {
  if (!hist.length) return;
  const prev = hist.pop();
  players = prev.players;
  cur = prev.cur;
  saveState();
  renderGame();
}

function askAbort() { document.getElementById('abort-modal').classList.add('show'); }
function closeModal() { document.getElementById('abort-modal').classList.remove('show'); }
function confirmAbort() { closeModal(); resetGame(); }

function showWinner() {
  gameActive = false;
  clearState();
  const w = players[cur];
  document.getElementById('win-name').textContent = w.name + ' gewinnt!';
  document.getElementById('win-pts').textContent = w.score.toLocaleString('de-DE') + ' Punkte';
  const sorted = [...players].sort((a,b) => b.score - a.score);
  const medals = ['🥇','🥈','🥉'];
  document.getElementById('final-board').innerHTML = sorted.map((pl, i) => `
    <div class="podium-row">
      <div class="podium-pos">${medals[i]||(i+1)+'.'}</div>
      <div class="podium-name">${pl.name}</div>
      <div class="podium-pts ${pl.score<0?'negative':''}">${pl.score.toLocaleString('de-DE')}</div>
    </div>`).join('');
  show('winner');
}

function resetGame() {
  gameActive = false;
  clearState();
  players = []; cur = 0; hist = [];
  show('count');
}
</script>
</body>
</html>
