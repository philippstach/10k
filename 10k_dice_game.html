
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: var(--font-sans); }
#app { padding: 1rem; max-width: 480px; margin: 0 auto; }
.screen { display: none; }
.screen.active { display: block; }
h1 { font-size: 22px; font-weight: 500; color: var(--color-text-primary); margin-bottom: 1rem; }
h2 { font-size: 18px; font-weight: 500; color: var(--color-text-primary); margin-bottom: 1rem; }
.card { background: var(--color-background-primary); border: 0.5px solid var(--color-border-tertiary); border-radius: var(--border-radius-lg); padding: 1rem 1.25rem; margin-bottom: 12px; }
.btn { display: inline-block; padding: 10px 20px; border: 0.5px solid var(--color-border-secondary); border-radius: var(--border-radius-md); background: transparent; color: var(--color-text-primary); font-size: 15px; cursor: pointer; transition: background 0.15s; }
.btn:hover { background: var(--color-background-secondary); }
.btn:active { transform: scale(0.98); }
.btn-primary { background: var(--color-text-primary); color: var(--color-background-primary); border-color: var(--color-text-primary); }
.btn-primary:hover { opacity: 0.85; }
.btn-danger { border-color: #A32D2D; color: #A32D2D; }
.btn-danger:hover { background: #FCEBEB; }
.btn-back { color: var(--color-text-secondary); font-size: 14px; margin-bottom: 1rem; padding: 6px 0; border: none; background: none; cursor: pointer; display: flex; align-items: center; gap: 4px; }
.btn-back:hover { color: var(--color-text-primary); }
input[type=text], input[type=number] { width: 100%; }
.player-row { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
.player-row input { flex: 1; }
.order-btn { padding: 6px 10px; font-size: 13px; }
.score-row { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 0.5px solid var(--color-border-tertiary); }
.score-row:last-child { border-bottom: none; }
.score-row.current { font-weight: 500; }
.score-name { font-size: 15px; color: var(--color-text-primary); }
.score-pts { font-size: 15px; color: var(--color-text-primary); }
.macke-dots { display: flex; gap: 4px; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--color-border-secondary); }
.dot.filled { background: #E24B4A; }
.warning-banner { background: #FCEBEB; border: 1px solid #F09595; border-radius: var(--border-radius-md); padding: 12px 16px; margin-bottom: 1rem; color: #791F1F; font-weight: 500; font-size: 15px; display: flex; align-items: center; gap: 8px; }
.current-player-card { background: var(--color-background-secondary); border-radius: var(--border-radius-lg); padding: 1rem 1.25rem; margin-bottom: 1rem; text-align: center; }
.current-label { font-size: 13px; color: var(--color-text-secondary); margin-bottom: 4px; }
.current-name { font-size: 22px; font-weight: 500; color: var(--color-text-primary); }
.current-score { font-size: 14px; color: var(--color-text-secondary); margin-top: 2px; }
.btn-row { display: flex; gap: 8px; margin-top: 1rem; }
.btn-row .btn { flex: 1; }
.winner-icon { font-size: 48px; text-align: center; margin: 1rem 0; }
.podium-row { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 0.5px solid var(--color-border-tertiary); }
.podium-pos { font-size: 20px; color: var(--color-text-secondary); width: 32px; }
.podium-name { flex: 1; font-size: 16px; color: var(--color-text-primary); }
.podium-pts { font-size: 16px; font-weight: 500; color: var(--color-text-primary); }
.progress-bar-bg { height: 6px; background: var(--color-background-secondary); border-radius: 3px; margin-top: 4px; }
.progress-bar { height: 6px; background: var(--color-text-primary); border-radius: 3px; transition: width 0.3s; }
</style>

<div id="app">

<div id="screen-intro" class="screen active">
  <div style="min-height:300px; display:flex; flex-direction:column; align-items:center; justify-content:center;">
    <div id="intro-display" style="font-size:72px; font-weight:500; color:var(--color-text-primary); letter-spacing:-2px; min-height:90px; display:flex; align-items:center;"></div>
    <p style="color:var(--color-text-secondary); font-size:15px; margin-top:1rem; opacity:0;" id="intro-sub">das Würfelspiel</p>
    <button class="btn btn-primary" style="margin-top:2rem; opacity:0; pointer-events:none;" id="intro-btn" onclick="showSetup()">Spiel einrichten</button>
  </div>
</div>

<div id="screen-setup" class="screen">
  <h1>Spieler einrichten</h1>
  <div class="card">
    <label style="font-size:14px; color:var(--color-text-secondary);">Wie viele Spieler?</label>
    <div style="display:flex; gap:8px; margin-top:8px; flex-wrap:wrap;">
      <button class="btn" onclick="setPlayerCount(2)">2</button>
      <button class="btn" onclick="setPlayerCount(3)">3</button>
      <button class="btn" onclick="setPlayerCount(4)">4</button>
      <button class="btn" onclick="setPlayerCount(5)">5</button>
      <button class="btn" onclick="setPlayerCount(6)">6</button>
    </div>
  </div>
  <div id="player-inputs" class="card" style="display:none;">
    <p style="font-size:14px; color:var(--color-text-secondary); margin-bottom:12px;">Namen & Reihenfolge</p>
    <div id="player-list"></div>
    <div style="margin-top:1rem;">
      <button class="btn btn-primary" style="width:100%;" onclick="startGame()">Spiel starten</button>
    </div>
  </div>
</div>

<div id="screen-game" class="screen">
  <button class="btn-back" onclick="undoLast()"><i class="ti ti-arrow-left" aria-hidden="true"></i> Zug zurücknehmen</button>
  <div id="warning-banner" class="warning-banner" style="display:none;">
    <i class="ti ti-alert-triangle" aria-hidden="true"></i>
    <span id="warning-text">Achtung – bereits 2x keine Punkte!</span>
  </div>
  <div class="current-player-card">
    <div class="current-label">Jetzt am Zug</div>
    <div class="current-name" id="current-name">–</div>
    <div class="current-score" id="current-score">0 Punkte</div>
    <div class="progress-bar-bg" style="margin-top:8px;">
      <div class="progress-bar" id="progress-bar" style="width:0%"></div>
    </div>
  </div>
  <div class="card" id="scoreboard"></div>
  <div class="card">
    <label style="font-size:14px; color:var(--color-text-secondary);">Punkte dieser Runde</label>
    <input type="number" id="points-input" placeholder="z.B. 250" style="margin-top:8px;" min="0" onkeydown="if(event.key==='Enter') addPoints()" />
    <div class="btn-row">
      <button class="btn btn-primary" onclick="addPoints()">Bestätigen</button>
      <button class="btn btn-danger" onclick="noPoints()">Keine Punkte</button>
    </div>
  </div>
</div>

<div id="screen-winner" class="screen">
  <div class="winner-icon">🏆</div>
  <h1 style="text-align:center;" id="winner-name">Gewinner</h1>
  <p style="text-align:center; color:var(--color-text-secondary); margin-bottom:1.5rem;" id="winner-score"></p>
  <div class="card" id="final-scoreboard"></div>
  <button class="btn btn-primary" style="width:100%; margin-top:1rem;" onclick="resetGame()">Neues Spiel</button>
</div>

</div>

<script>
let players = [];
let currentIdx = 0;
let history = [];

function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById('screen-' + id).classList.add('active');
}

function setPlayerCount(n) {
  const list = document.getElementById('player-list');
  list.innerHTML = '';
  for (let i = 0; i < n; i++) {
    list.innerHTML += `<div class="player-row" id="row-${i}">
      <input type="text" placeholder="Spieler ${i+1}" id="pname-${i}" value="" />
      <button class="btn order-btn" onclick="moveUp(${i})" aria-label="Nach oben"><i class="ti ti-chevron-up" aria-hidden="true"></i></button>
      <button class="btn order-btn" onclick="moveDown(${i})" aria-label="Nach unten"><i class="ti ti-chevron-down" aria-hidden="true"></i></button>
    </div>`;
  }
  document.getElementById('player-inputs').style.display = 'block';
}

function getNames() {
  const inputs = document.querySelectorAll('[id^="pname-"]');
  return Array.from(inputs).map((inp, i) => inp.value.trim() || 'Spieler ' + (i+1));
}

function moveUp(i) {
  const inputs = document.querySelectorAll('[id^="pname-"]');
  if (i === 0) return;
  const tmp = inputs[i].value;
  inputs[i].value = inputs[i-1].value;
  inputs[i-1].value = tmp;
}

function moveDown(i) {
  const inputs = document.querySelectorAll('[id^="pname-"]');
  if (i >= inputs.length - 1) return;
  const tmp = inputs[i].value;
  inputs[i].value = inputs[i+1].value;
  inputs[i+1].value = tmp;
}

function startGame() {
  const names = getNames();
  players = names.map(name => ({ name, score: 0, zeroStreak: 0 }));
  currentIdx = 0;
  history = [];
  updateGameScreen();
  showScreen('game');
}

function updateGameScreen() {
  const p = players[currentIdx];
  document.getElementById('current-name').textContent = p.name;
  document.getElementById('current-score').textContent = p.score.toLocaleString('de-DE') + ' Punkte';
  const pct = Math.min(100, Math.max(0, (p.score / 10000) * 100));
  document.getElementById('progress-bar').style.width = pct + '%';

  const banner = document.getElementById('warning-banner');
  if (p.zeroStreak === 2) {
    banner.style.display = 'flex';
    document.getElementById('warning-text').textContent = 'Achtung – bereits 2x keine Punkte!';
  } else {
    banner.style.display = 'none';
  }

  const board = document.getElementById('scoreboard');
  board.innerHTML = players.map((pl, i) => {
    const dots = [0,1,2].map(d => `<div class="dot ${d < pl.zeroStreak ? 'filled' : ''}"></div>`).join('');
    return `<div class="score-row ${i === currentIdx ? 'current' : ''}">
      <span class="score-name">${i === currentIdx ? '▶ ' : ''}${pl.name}</span>
      <div style="display:flex;align-items:center;gap:12px;">
        <div class="macke-dots">${dots}</div>
        <span class="score-pts">${pl.score.toLocaleString('de-DE')}</span>
      </div>
    </div>`;
  }).join('');

  document.getElementById('points-input').value = '';
  document.getElementById('points-input').focus();
}

function saveHistory() {
  history.push({
    players: JSON.parse(JSON.stringify(players)),
    currentIdx
  });
  if (history.length > 50) history.shift();
}

function addPoints() {
  const val = parseInt(document.getElementById('points-input').value);
  if (isNaN(val) || val < 0) { noPoints(); return; }
  if (val === 0) { noPoints(); return; }
  saveHistory();
  players[currentIdx].score += val;
  players[currentIdx].zeroStreak = 0;
  if (players[currentIdx].score >= 10000) {
    showWinner(currentIdx);
    return;
  }
  nextPlayer();
}

function noPoints() {
  saveHistory();
  players[currentIdx].zeroStreak++;
  if (players[currentIdx].zeroStreak >= 3) {
    players[currentIdx].score -= 500;
    players[currentIdx].zeroStreak = 0;
  }
  nextPlayer();
}

function nextPlayer() {
  currentIdx = (currentIdx + 1) % players.length;
  updateGameScreen();
}

function undoLast() {
  if (history.length === 0) return;
  const prev = history.pop();
  players = prev.players;
  currentIdx = prev.currentIdx;
  updateGameScreen();
}

function showWinner(idx) {
  const winner = players[idx];
  document.getElementById('winner-name').textContent = winner.name + ' gewinnt!';
  document.getElementById('winner-score').textContent = winner.score.toLocaleString('de-DE') + ' Punkte';
  const sorted = [...players].sort((a,b) => b.score - a.score);
  const medals = ['🥇','🥈','🥉'];
  document.getElementById('final-scoreboard').innerHTML = sorted.map((pl, i) => `
    <div class="podium-row">
      <div class="podium-pos">${medals[i] || (i+1) + '.'}</div>
      <div class="podium-name">${pl.name}</div>
      <div class="podium-pts">${pl.score.toLocaleString('de-DE')}</div>
    </div>`).join('');
  showScreen('winner');
}

function resetGame() {
  players = [];
  currentIdx = 0;
  history = [];
  document.getElementById('player-inputs').style.display = 'none';
  showScreen('setup');
}

function showSetup() {
  showScreen('setup');
}

(function animateIntro() {
  const el = document.getElementById('intro-display');
  const sub = document.getElementById('intro-sub');
  const btn = document.getElementById('intro-btn');
  let n = 0;
  const target = 10;
  const step = () => {
    n += Math.ceil((target - n) / 3) || 1;
    if (n >= target) {
      n = target;
      el.textContent = '10';
      setTimeout(() => {
        el.style.transition = 'all 0.3s';
        el.textContent = '10k';
        sub.style.transition = 'opacity 0.5s';
        sub.style.opacity = '1';
        btn.style.transition = 'opacity 0.5s 0.3s';
        btn.style.opacity = '1';
        btn.style.pointerEvents = 'auto';
      }, 200);
      return;
    }
    el.textContent = n;
    setTimeout(step, 80);
  };
  setTimeout(step, 400);
})();
</script>
